<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <title>Dodaj pjesmu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">StreamTrack</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link active" href="/dodaj/pjesmu">Dodaj pjesmu</a>
                <a class="nav-link" href="/vrati/pjesme">Popis pjesama</a>
                <a class="nav-link" href="/vrati/pjesme/vizualizacija">Vizualizacija</a>
            </div>
        </div>
    </nav>

    <div class="container main-box">
        <h2>Dodaj novu pjesmu</h2>

        {% if greska %}
        <div class="alert alert-danger">
            {{ greska }}
        </div>
        {% endif %}

        {% if poruka %}
        <div class="alert alert-success">
            {{ poruka }}
        </div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Naslov pjesme:</label>
                <input type="text" class="form-control" name="naslov" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Izvođač:</label>
                <input type="text" class="form-control" name="izvodac" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Godina:</label>
                <input type="number" class="form-control" name="godina" min="1900" max="2100" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Platforma:</label>
                <select class="form-select" name="platforma" id="platforma" onchange="postaviZaradu()" required>
                    <option value="Spotify">Spotify</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Apple Music">Apple Music</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Broj streamova na dan zapisa:</label>
                <input type="number" class="form-control" name="broj_streamova" min="0" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Zarada po streamu:</label>
                <input type="number" step="any" class="form-control" name="zarada_po_streamu" id="zarada_po_streamu"
                    value="0.004" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Datum zapisa streamova:</label>
                <input type="date" class="form-control" name="datum_izmjene">
            </div>

            <button type="submit" class="btn btn-success">Spremi pjesmu</button>
            <a href="/vrati/pjesme" class="btn btn-secondary">Popis pjesama</a>
        </form>
    </div>

    <script>
        function postaviZaradu() {
            let platforma = document.getElementById("platforma").value;
            let zarada = document.getElementById("zarada_po_streamu");

            if (platforma == "Spotify") {
                zarada.value = 0.004;
            }

            if (platforma == "YouTube") {
                zarada.value = 0.001;
            }

            if (platforma == "Apple Music") {
                zarada.value = 0.007;
            }
        }
    </script>

</body>

</html>
